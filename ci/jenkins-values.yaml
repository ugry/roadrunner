# Helm values for the official Jenkins chart (jenkinsci/jenkins).
# Config-as-Code: admin user, plugin set, and a seeded Insucar pipeline job from the repo.
controller:
  admin:
    username: "admin"
    # password provided at install via --set controller.admin.password=... (not committed)
  serviceType: LoadBalancer
  installLatestPlugins: true
  # NOTE: configuration-as-code, git, workflow-aggregator are already in the chart defaults.
  additionalPlugins:
    - workflow-job
    - pipeline-stage-view
    - docker-workflow
    - job-dsl
    - credentials
    - credentials-binding
    - matrix-auth
  # GITHUB_PAT is injected from a k8s secret so JCasC can create the git credential
  containerEnv:
    - name: GITHUB_PAT
      valueFrom:
        secretKeyRef:
          name: github-pat
          key: token
  JCasC:
    defaultConfig: true
    configScripts:
      insucar-credentials: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: "github-pat"
                      username: "ugry"
                      password: "${GITHUB_PAT}"
                      description: "GitHub PAT for private repo checkout"
      insucar-seed-job: |
        jobs:
          - script: >
              pipelineJob('insucar-ci') {
                description('Insucar CI: build/test Go, docker build, push ECR, trigger Spinnaker')
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote {
                          url('https://github.com/ugry/insucar.git')
                          credentials('github-pat')
                        }
                        branches('*/main')
                      }
                    }
                    scriptPath('ci/Jenkinsfile')
                  }
                }
              }
persistence:
  enabled: true
  size: 8Gi
