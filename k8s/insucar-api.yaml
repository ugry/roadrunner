apiVersion: v1
kind: ServiceAccount
metadata:
  name: insucar-api
  namespace: insucar
  # IRSA: annotate with the app role ARN from `terraform output app_irsa_role_arn`
  # (grants SNS/EventBridge/SQS + Secrets Manager without static keys).
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_app_irsa_role_arn
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: insucar-api, namespace: insucar, labels: { app: insucar-api } }
spec:
  replicas: 2
  selector: { matchLabels: { app: insucar-api } }
  template:
    metadata: { labels: { app: insucar-api } }
    spec:
      serviceAccountName: insucar-api
      imagePullSecrets:
        - { name: ecr-cred }
      containers:
        - name: insucar-api
          image: 326804802908.dkr.ecr.eu-west-1.amazonaws.com/insucar-api:1
          env:
            # Managed data: DATABASE_URL points at Amazon RDS (Multi-AZ) and
            # REDIS_URL at Amazon ElastiCache, both via the 'insucar-app' Secret.
            # Create it from the Terraform outputs (rds_endpoint / redis_primary_endpoint
            # + the RDS/Redis secrets), e.g.:
            #   kubectl -n insucar create secret generic insucar-app \
            #     --from-literal=DATABASE_URL="postgres://insucar_admin:<pw>@<rds-endpoint>:5432/insucar?sslmode=require" \
            #     --from-literal=REDIS_URL="rediss://:<auth>@<redis-endpoint>:6379"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: insucar-app, key: DATABASE_URL }
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: { name: insucar-app, key: REDIS_URL }
          ports: [ { containerPort: 8080 } ]
          resources:
            requests: { cpu: "100m", memory: "64Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: insucar-api, namespace: insucar }
spec:
  type: LoadBalancer
  selector: { app: insucar-api }
  ports: [ { port: 80, targetPort: 8080 } ]
