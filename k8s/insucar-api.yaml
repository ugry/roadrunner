apiVersion: v1
kind: ServiceAccount
metadata:
  name: insucar-api
  namespace: insucar
  # IRSA: annotate with the app role ARN from `terraform output app_irsa_role_arn`
  # (grants SNS/EventBridge/SQS + Secrets Manager without static keys).
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_app_irsa_role_arn
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: insucar-config
  namespace: insucar
# Non-secret runtime config, populated from Terraform outputs (per environment).
# Secrets (DATABASE_URL, REDIS_URL) live in the 'insucar-app' Secret instead.
data:
  AWS_REGION: "eu-west-1"
  # `terraform output event_bus_name`
  EVENT_BUS_NAME: "insucar-prod"
  # `terraform output sqs_queue_urls` (consumed by insucar-worker)
  DISPATCH_QUEUE_URL: "https://sqs.eu-west-1.amazonaws.com/326804802908/insucar-prod-dispatch"
  NOTIFICATION_QUEUE_URL: "https://sqs.eu-west-1.amazonaws.com/326804802908/insucar-prod-notification"
  # `terraform output cognito_staff_issuer`
  COGNITO_ISSUER: "https://cognito-idp.eu-west-1.amazonaws.com/eu-west-1_MFJIcHYbC"
  # comma-separated app client ids allowed to call the API
  # (`terraform output cognito_spinnaker_client_id` + console/app client ids)
  COGNITO_CLIENT_IDS: "7n33nbhutvt7r3fia98bcksbt0,2emse8epipp11skn1irea09q3m"
  # Staff pool issuer (separate pool for staff/operators)
  COGNITO_STAFF_ISSUER: "https://cognito-idp.eu-west-1.amazonaws.com/eu-west-1_DhDKa73Dn"
  # Staff client IDs
  COGNITO_STAFF_CLIENT_IDS: "2emse8epipp11skn1irea09q3m"
  # Frontend Cognito config (fed to /api/auth/config for PKCE OAuth2):
  COGNITO_CUSTOMER_DOMAIN: "insucar-dev-customer"
  COGNITO_CUSTOMER_CLIENT_ID: "7n33nbhutvt7r3fia98bcksbt0"
  COGNITO_STAFF_DOMAIN: "insucar-dev-staff"
  COGNITO_STAFF_CLIENT_ID: "2emse8epipp11skn1irea09q3m"
  PROVIDER_API_URL: "http://provider-axa.insucar.svc.cluster.local:5678"
  STATUS_LINK_BASE: "https://app.unysolar.com/status"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: insucar-api, namespace: insucar, labels: { app: insucar-api } }
spec:
  replicas: 2
  selector: { matchLabels: { app: insucar-api } }
  template:
    metadata: { labels: { app: insucar-api } }
    spec:
      serviceAccountName: insucar-api
      imagePullSecrets:
        - { name: ecr-cred }
      containers:
        - name: insucar-api
          image: 326804802908.dkr.ecr.eu-west-1.amazonaws.com/insucar-api:1
          envFrom:
            # Non-secret config (AWS_REGION, EVENT_BUS_NAME, COGNITO_*, PROVIDER_API_URL, STATUS_LINK_BASE)
            - configMapRef: { name: insucar-config }
            # Managed-service credentials: DATABASE_URL (RDS) + SESSION_SECRET.
            # Also supports: REDIS_URL (ElastiCache) for session store / caching.
            # Create from Terraform outputs or current live values:
            #   kubectl -n insucar create secret generic insucar-app \
            #     --from-literal=DATABASE_URL="postgres://postgres:test@postgres.insucar.svc.cluster.local:5432/insucar?sslmode=disable" \
            #     --from-literal=SESSION_SECRET="<random-64-char-hex>" \
            #     --from-literal=REDIS_URL="rediss://:<auth>@<redis-endpoint>:6379"
            - secretRef: { name: insucar-app }
          ports: [ { containerPort: 8080 } ]
          resources:
            requests: { cpu: "100m", memory: "64Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: insucar-api, namespace: insucar }
spec:
  type: ClusterIP
  selector: { app: insucar-api }
  ports: [ { port: 80, targetPort: 8080 } ]
