apiVersion: apps/v1
kind: Deployment
metadata: { name: insucar-worker, namespace: insucar, labels: { app: insucar-worker } }
spec:
  replicas: 2
  selector: { matchLabels: { app: insucar-worker } }
  template:
    metadata: { labels: { app: insucar-worker } }
    spec:
      # Reuses the insucar-api ServiceAccount (its IRSA role already has the
      # SQS receive/delete permissions granted in terraform/iam.tf).
      serviceAccountName: insucar-api
      imagePullSecrets:
        - { name: ecr-cred }
      containers:
        - name: insucar-worker
          image: 326804802908.dkr.ecr.eu-west-1.amazonaws.com/insucar-worker:latest
          envFrom:
            # DISPATCH_QUEUE_URL + AWS_REGION come from the config map;
            # DATABASE_URL/REDIS_URL from the secret (for real processing).
            - configMapRef: { name: insucar-config }
            - secretRef: { name: insucar-app }
          resources:
            requests: { cpu: "50m", memory: "32Mi" }
            limits: { cpu: "250m", memory: "128Mi" }
