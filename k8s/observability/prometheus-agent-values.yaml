# Helm values for the in-cluster Prometheus AGENT that scrapes EKS and
# remote_writes to Amazon Managed Service for Prometheus (AMP).
#
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   kubectl create namespace monitoring
#   helm -n monitoring install prometheus prometheus-community/prometheus \
#     -f k8s/observability/prometheus-agent-values.yaml
#
# Fill the placeholders from Terraform outputs:
#   REPLACE_prometheus_irsa_role_arn  <- terraform output prometheus_irsa_role_arn
#   REPLACE_amp_remote_write_url       <- terraform output amp_remote_write_url
# Grafana (Amazon Managed Grafana) then reads this AMP workspace as a data source.

serviceAccounts:
  server:
    name: prometheus-server
    annotations:
      eks.amazonaws.com/role-arn: REPLACE_prometheus_irsa_role_arn

server:
  # Agent mode: scrape + remote_write only (no local TSDB/querying).
  extraFlags:
    - enable-feature=agent
  persistentVolume:
    enabled: false
  remoteWrite:
    - url: REPLACE_amp_remote_write_url
      sigv4:
        region: eu-west-1
      queue_config:
        max_samples_per_send: 1000
        max_shards: 200
        capacity: 2500

# Trim components not needed in agent mode.
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
kube-state-metrics:
  enabled: true
prometheus-node-exporter:
  enabled: true
