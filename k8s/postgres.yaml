apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: insucar, labels: { app: postgres } }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:15-3.4
          env:
            - { name: POSTGRES_PASSWORD, value: "test" }
            - { name: POSTGRES_DB, value: "insucar" }
          ports: [ { containerPort: 5432 } ]
          volumeMounts:
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec: { command: ["pg_isready","-U","postgres","-d","insucar"] }
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: init
          configMap: { name: db-init }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: insucar }
spec:
  selector: { app: postgres }
  ports: [ { port: 5432, targetPort: 5432 } ]
