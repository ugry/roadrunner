<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Insucar — Sign in</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a7d5a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--brand:#0a7d5a;--brand-d:#086a4d;--navy:#0b1f2a;--amber:#f5a623;--bg:#f4f8f6;--surface:#fff;--line:#e3ece8;--muted:#5b7183;--fg:#0b1f2a;--radius:16px;--font:Inter,system-ui,Arial,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);color:var(--fg);background:radial-gradient(1100px 560px at 82% -12%,rgba(10,125,90,.10),transparent 60%),var(--bg);min-height:100vh}
  .bar{display:flex;align-items:center;gap:12px;padding:16px 26px;background:var(--surface);border-bottom:1px solid var(--line)}
  .bar .who{margin-left:auto;font-size:13px;color:var(--muted)}
  .wm{font-size:20px;font-weight:800;letter-spacing:-.02em}.wm span{color:var(--brand)}
  .wrap{max-width:560px;margin:34px auto;padding:0 16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 20px 60px rgba(11,31,42,.08);overflow:hidden}
  .card-h{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--line)}
  .card-b{padding:22px}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:16px}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;color:var(--fg);background:#fbfdfc}
   input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:2px;border-color:var(--brand);box-shadow:0 0 0 3px rgba(10,125,90,.4)}
   button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .row{display:flex;gap:12px}.row>div{flex:1}
  .btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;width:100%;margin-top:14px}
  .btn-primary{background:var(--brand);color:#fff}.btn-primary:hover{background:var(--brand-d)}
  .btn-danger{background:var(--amber);color:#3a2600}.btn-danger:hover{filter:brightness(.97)}
  .btn-ghost{background:#eef4f1;color:var(--navy)}
  .tabs{display:flex;gap:16px}.tabx{cursor:pointer;color:var(--muted);font-weight:700}.tabx.on{color:var(--brand)}
  .muted{color:var(--muted)} .hidden{display:none}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}td,th{border-bottom:1px solid var(--line);padding:8px;text-align:left}
  .pill{padding:2px 9px;border-radius:999px;background:#e6f4ee;color:var(--brand);font-size:12px;font-weight:700}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  @media(max-width:640px){.grid2{grid-template-columns:1fr}}
  #out{margin-top:10px;font-size:13px}
  .logo{width:34px;height:34px}
  .topbtn{border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:700;font-size:14px;padding:8px 16px;border-radius:10px;cursor:pointer}
  .topbtn:hover{border-color:var(--brand);color:var(--brand)}
  .case-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fbfdfc}
  .case-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .case-no{font-weight:800;font-size:14px}
  .case-type{font-size:12px;color:var(--muted);text-transform:capitalize;margin-top:3px}
  .case-desc{margin-top:6px;font-size:14px;line-height:1.45;word-break:break-word;overflow-wrap:anywhere;white-space:normal}
   #cases{max-height:60vh;overflow-y:auto}
   .wiz-steps{display:flex;gap:4px;margin-bottom:16px}.wiz-step{flex:1;height:4px;border-radius:2px;background:var(--line)}.wiz-step.done{background:var(--brand)}.wiz-step.now{background:var(--brand);box-shadow:0 0 6px rgba(10,125,90,.5)}
   .panic-btn{display:flex;align-items:center;gap:8px;background:#fff5f5;border:2px solid #e74c3c;border-radius:10px;padding:10px 14px;font-weight:700;font-size:13px;color:#e74c3c;cursor:pointer;width:100%;text-align:left;margin:8px 0}.panic-btn:hover{background:#ffeaea}
   .wiz-nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.wiz-nav button{flex:1}
   @media(prefers-contrast:more){:root{--line:#8b9ea7;--muted:#4a5568;--fg:#000}.card{border-width:2px}.btn{font-weight:800}}
   @media(prefers-color-scheme:dark){:root{--brand:#12a06f;--bg:#0b1f2a;--surface:#12303e;--line:#1e3a4a;--muted:#7a8fa0;--fg:#e8f0f4;--navy:#e8f0f4}body{background:radial-gradient(1100px 560px at 82% -12%,rgba(10,125,90,.15),transparent 60%),var(--bg)}input,select,textarea,.topbtn{background:#1a3545;border-color:var(--line);color:var(--fg)}.case-item{background:#152d3a}.btn-ghost{background:#1a3545}.btn-primary{color:#fff}}
</style></head>
<body>
<div class="bar">
  <svg class="logo" viewBox="0 0 80 80" aria-hidden="true"><defs><linearGradient id="s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12a06f"/><stop offset="1" stop-color="#0a7d5a"/></linearGradient></defs><path d="M40 3 L73 15 V40 C73 57 60 69 40 77 C20 69 7 57 7 40 V15 Z" fill="url(#s)"/><path d="M23 63 L36 25 H44 L57 63 Z" fill="#fff" opacity=".92"/><g transform="translate(40,23)"><path d="M0 -12 C6.6 -12 11 -7.6 11 -1.5 C11 5.5 0 14 0 14 C0 14 -11 5.5 -11 -1.5 C-11 -7.6 -6.6 -12 0 -12 Z" fill="#f5a623"/><circle cy="-1.5" r="4" fill="#0b1f2a"/></g></svg>
  <div class="wm">Insu<span>car</span></div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:12px">
    <span class="who" id="whoami"></span>
    <button id="loginTop" class="topbtn" onclick="showTab('login')">Log in</button>
    <button id="logoutTop" class="topbtn hidden" onclick="logout()">Log out</button>
  </div>
</div>

<div class="wrap">
  <!-- AUTH -->
  <div class="card" id="authcard">
    <div class="card-h"><div class="tabs"><span id="tabLogin" class="tabx on" onclick="showTab('login')">Log in</span><span id="tabReg" class="tabx" onclick="showTab('reg')">Register</span></div><span class="pill" style="margin-left:auto">unysolar.com</span></div>
    <div class="card-b">
      <div id="login">
        <h1>Welcome back</h1><div class="sub">Sign in to request assistance and track your case.</div>
        <label>Email</label><input id="l_email" value="claire.martin@example.fr">
        <label>Password</label><input id="l_pass" type="password" value="Claire#2026">
        <button class="btn btn-primary" onclick="login()">Log in</button>
        <div id="cognitoLogin" class="hidden" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)"><button class="btn btn-ghost" onclick="pkceLogin()" style="margin-top:0">Sign in with Cognito</button><div style="font-size:12px;color:var(--muted);margin-top:6px;text-align:center">Managed SSO login</div></div>
      </div>
      <div id="reg" class="hidden">
        <h1>Create your account</h1><div class="sub">Register so we already know you and your vehicle when you break down.</div>
        <div class="row"><div><label>First name</label><input id="r_first" value="New"></div><div><label>Last name</label><input id="r_last" value="Customer"></div></div>
        <label>Email</label><input id="r_email" placeholder="you@example.com">
        <div class="row"><div><label>Country</label><select id="r_country"><option>FR</option><option>GB</option><option>DE</option></select></div><div><label>Mobile (E.164)</label><input id="r_phone" placeholder="+33600000009"></div></div>
        <label>Password</label><input id="r_pass" type="password">
        <button class="btn btn-primary" onclick="register()">Create account &amp; sign in</button>
      </div>
      <div id="out" class="muted"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dash" class="hidden">
    <div class="grid2">
       <div class="card"><div class="card-h"><b>🚨 Request assistance</b></div><div class="card-b">
         <!-- 4-step wizard progress -->
         <div class="wiz-steps"><div class="wiz-step now" id="ws1"></div><div class="wiz-step" id="ws2"></div><div class="wiz-step" id="ws3"></div><div class="wiz-step" id="ws4"></div></div>
         <!-- Step 1: What happened -->
         <div id="wizard1"><label for="i_type">What happened?</label><select id="i_type"><option value="breakdown">Car won't start</option><option value="accident">Accident</option><option value="flat_tyre">Flat tyre</option><option value="ev_no_charge">EV — no charge</option><option value="medical_emergency">Driver ill / medical</option><option value="other">Other</option></select><button class="btn btn-ghost" style="margin-top:6px" onclick="startVoiceGuidance()">🎤 Describe with voice</button><button class="btn btn-primary" onclick="nextWiz(2)">Next →</button></div>
         <!-- Step 2: Where -->
         <div id="wizard2" class="hidden"><label for="i_addr">Where are you?</label><input id="i_addr" placeholder="A6 southbound, km 292" aria-label="Location"><button type="button" class="btn-ghost" style="width:auto;padding:4px 10px;font-size:12px;margin:4px 0" onclick="getGPSLocation()">📍 Use GPS</button><input id="i_w3w" placeholder="///what.three.words" style="font-family:monospace;font-size:13px;margin-top:6px" aria-label="what3words"><label for="i_photo">Photo of scene <span style="font-size:11px;color:var(--muted);font-weight:400">(optional)</span></label><input type="file" id="i_photo" accept="image/*" capture="environment" onchange="previewPhoto()" style="padding:9px;margin-bottom:6px"><img id="photoPreview" style="display:none;max-width:100%;max-height:180px;border-radius:8px;margin-bottom:8px;border:1px solid var(--line)"><div class="wiz-nav"><button class="btn btn-ghost" onclick="nextWiz(1)">← Back</button><button class="btn btn-primary" onclick="nextWiz(3)">Next →</button></div></div>
         <!-- Step 3: Describe -->
         <div id="wizard3" class="hidden"><label for="i_desc">Describe the situation</label><textarea id="i_desc" rows="3" placeholder="What happened? Any injuries? Is the vehicle in a safe position?" aria-label="Description"></textarea>
         <div style="display:flex;gap:4px;margin:6px 0"><button type="button" class="btn-ghost" style="width:auto;padding:3px 8px;font-size:10px;margin:0" onclick="showPhrases('en')">EN</button><button type="button" class="btn-ghost" style="width:auto;padding:3px 8px;font-size:10px;margin:0" onclick="showPhrases('fr')">FR</button><button type="button" class="btn-ghost" style="width:auto;padding:3px 8px;font-size:10px;margin:0" onclick="showPhrases('de')">DE</button><button type="button" class="btn-ghost" style="width:auto;padding:3px 8px;font-size:10px;margin:0" onclick="showPhrases('es')">ES</button></div>
         <div id="phraseCards"></div><button class="panic-btn" onclick="panicMode()" aria-label="I don't feel safe — escalate priority"><span style="font-size:18px">🆘</span> I don't feel safe — escalate immediately</button><div class="wiz-nav"><button class="btn btn-ghost" onclick="nextWiz(2)">← Back</button><button class="btn btn-primary" onclick="nextWiz(4)">Next →</button></div></div>
         <!-- Step 4: Confirm -->
         <div id="wizard4" class="hidden"><div style="text-align:center;padding:10px 0"><b id="wizSummary" style="font-size:15px"></b></div><div id="holdBtn" style="position:relative;margin-top:8px" onmousedown="startHold()" onmouseup="cancelHold()" onmouseleave="cancelHold()" ontouchstart="startHold()" ontouchend="cancelHold()" ontouchcancel="cancelHold()"><button class="btn btn-danger" style="position:relative;z-index:1;pointer-events:none" aria-label="Press and hold for 3 seconds to request assistance">🚨 Press &amp; hold to request help</button><div id="holdProgress" style="position:absolute;top:0;left:0;height:100%;background:var(--brand);border-radius:10px;width:0%;transition:none;z-index:0;opacity:0.3"></div></div><button class="btn btn-ghost" style="margin-top:8px" onclick="nextWiz(3)">← Back</button></div>
       </div></div>
      <div class="card"><div class="card-h"><b>My cases</b><span class="pill" id="me2" style="margin-left:auto"></span></div><div class="card-b" style="padding-top:8px"><div id="cases" class="muted">—</div></div></div>
    </div>
  </div>
</div>

<script>
// --- Cognito config (populated by backend or env; empty = no Cognito login) ---
const cognitoCfg = { domain: '', region: 'eu-west-1', clientId: '', redirectUri: location.origin + '/app/callback' };
(async () => { try { const r = await fetch('/api/auth/config'); if (r.ok) { const c = await r.json(); if (c.customerDomain) { cognitoCfg.domain = c.customerDomain; cognitoCfg.region = c.region; cognitoCfg.clientId = c.customerClientId; document.getElementById('cognitoLogin').classList.remove('hidden'); } } } catch (_) {} })();

function pkceLogin() {
  const verifier = Array.from(crypto.getRandomValues(new Uint8Array(32))).map(b => String.fromCharCode('A'.charCodeAt(0)+b%26)).join('');
  const encoder = new TextEncoder();
  crypto.subtle.digest('SHA-256', encoder.encode(verifier)).then(hash => {
    const challenge = btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
    const state = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => b.toString(16).padStart(2,'0')).join('');
    localStorage.setItem('cognito_pkce', JSON.stringify({ verifier, state, domain: cognitoCfg.domain, region: cognitoCfg.region, clientId: cognitoCfg.clientId, redirectUri: cognitoCfg.redirectUri, returnTo: '/app' }));
    const url = `https://${cognitoCfg.domain}.auth.${cognitoCfg.region}.amazoncognito.com/oauth2/authorize?response_type=code&client_id=${encodeURIComponent(cognitoCfg.clientId)}&redirect_uri=${encodeURIComponent(cognitoCfg.redirectUri)}&state=${state}&code_challenge_method=S256&code_challenge=${challenge}&scope=openid+email+profile`;
    window.location.href = url;
  });
}

function bearerApi(p, o) {
  o = o || {};
  o.headers = Object.assign({ 'Content-Type': 'application/json' }, o.headers || {});
  var tok = null;
  try { tok = JSON.parse(localStorage.getItem('cognito_tokens')); } catch (_) {}
  if (tok && tok.access_token && Date.now() < tok.expires_at) {
    o.headers['Authorization'] = 'Bearer ' + tok.access_token;
  } else {
    o.credentials = 'include';
  }
  return fetch(p, o).then(function(r) { return r.json().then(function(b) { return { ok: r.ok, status: r.status, body: b }; }).catch(function() { return { ok: r.ok, status: r.status, body: {} }; }); });
}

function api(p,o){return bearerApi(p,o);}
function v(id){return document.getElementById(id).value;}function el(id){return document.getElementById(id);}
function showTab(t){el('tabLogin').classList.toggle('on',t=='login');el('tabReg').classList.toggle('on',t=='reg');el('login').classList.toggle('hidden',t!='login');el('reg').classList.toggle('hidden',t!='reg');}
async function login(){const r=await api('/api/user/login',{method:'POST',body:JSON.stringify({email:v('l_email'),password:v('l_pass')})});if(r.ok)enter(r.body);else el('out').textContent='⚠ '+(r.body.error||'login failed');}
async function register(){const r=await api('/api/register',{method:'POST',body:JSON.stringify({first:v('r_first'),last:v('r_last'),email:v('r_email'),country:v('r_country'),phone:v('r_phone'),password:v('r_pass'),consents:['terms','privacy']})});if(r.ok)enter({name:v('r_first')+' '+v('r_last')});else el('out').textContent='⚠ '+(r.body.error||'register failed');}
async function logout(){
  localStorage.removeItem('cognito_tokens');
  localStorage.removeItem('cognito_pkce');
  await api('/api/logout',{method:'POST'});
  location.reload();
}
function enter(me){el('authcard').classList.add('hidden');el('dash').classList.remove('hidden');el('whoami').textContent=me.name||'';el('me2').textContent=me.name||'';el('loginTop').classList.add('hidden');el('logoutTop').classList.remove('hidden');loadCases();}
function previewPhoto() {
  var f = el('i_photo').files[0];
  var img = el('photoPreview');
  if (!f) { img.style.display = 'none'; return; }
  var reader = new FileReader();
  reader.onload = function(e) { img.src = e.target.result; img.style.display = 'block'; };
  reader.readAsDataURL(f);
}
var holdTimer = null;
var holdStart = 0;
function startHold() {
  holdStart = Date.now();
  el('holdProgress').style.transition = 'none';
  el('holdProgress').style.width = '0%';
  holdTimer = setInterval(function() {
    var elapsed = Date.now() - holdStart;
    var pct = Math.min(100, (elapsed / 2500) * 100);
    el('holdProgress').style.width = pct + '%';
    if (elapsed >= 2500) { cancelHold(); submitIncident(); }
  }, 50);
}
function cancelHold() {
  if (holdTimer) { clearInterval(holdTimer); holdTimer = null; }
  el('holdProgress').style.transition = 'width 0.3s ease';
  el('holdProgress').style.width = '0%';
}
function reverseGeocode() {
  var w3w = v('i_w3w').replace(/^\/\/\//,'').trim();
  if (w3w) { el('i_addr').value = '///' + w3w; el('i_addr').placeholder = 'what3words location set'; }
  else { getGPSLocation(); }
}
var wizardStep = 1;
function nextWiz(n) {
  wizardStep = n;
  for (var i=1;i<=4;i++) { var s=el('wizard'+i); s.classList.toggle('hidden', i!==n); var d=el('ws'+i); d.classList.remove('done','now'); if(i<n)d.classList.add('done'); if(i===n)d.classList.add('now'); }
  if (n===4) el('wizSummary').textContent = (v('i_type')||'help') + ' near ' + (v('i_addr')||'your location') + (v('i_desc')?' — '+v('i_desc').slice(0,60):'');
}
function panicMode() {
  el('i_type').value = 'medical_emergency';
  nextWiz(4);
  el('wizSummary').textContent = '⚠ EMERGENCY — help requested immediately';
  el('wizSummary').style.color = '#e74c3c';
  wizPanic = true;
}
var wizPanic = false;

async function submitIncident() {
  // If photo attached, upload it first
  var photoId = '';
  var file = el('i_photo').files[0];
  if (file) {
    var fd = new FormData();
    fd.append('photo', file);
    fd.append('type', 'incident_scene');
    try {
      var pr = await fetch('/api/upload/photo', { method: 'POST', body: fd, credentials: 'include' });
      var pd = await pr.json();
      if (pr.ok) photoId = pd.photo_id || '';
    } catch(e) { console.log('Photo upload skipped:', e); }
  }
  var body = { incident: v('i_type'), description: v('i_desc'), address: v('i_addr'),
               lat: sessionStorage.getItem('gps_lat') || '', lng: sessionStorage.getItem('gps_lng') || '',
               photo_id: photoId };
  var r = await api('/api/user/incident', { method: 'POST', body: JSON.stringify(body) });
  if (r.ok) { alert('Case created: ' + r.body.case_number + ' — a coordinator will assist you.'); loadCases(); }
  else alert('Error: ' + (r.body.error || r.status));
}
function getGPSLocation() {
  el('i_addr').placeholder = 'Getting location…';
  el('i_addr').value = '';
  if (!navigator.geolocation) { el('i_addr').placeholder = 'GPS not supported by browser'; return; }
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      var lat = pos.coords.latitude.toFixed(5);
      var lng = pos.coords.longitude.toFixed(5);
      sessionStorage.setItem('gps_lat', lat);
      sessionStorage.setItem('gps_lng', lng);
      el('i_addr').value = lat + ', ' + lng;
      el('i_addr').placeholder = 'GPS coordinates saved';
    },
    function(err) { el('i_addr').placeholder = 'Location unavailable: ' + (err.message || 'denied'); },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function loadCases(){const r=await api('/api/user/cases');const c=r.body.cases||[];if(!c.length){el('cases').textContent='No cases yet.';return;}
 let h='';c.forEach(x=>{
  var rated = x.score > 0;
  h+='<div class="case-item"><div class="case-top"><span class="case-no">'+esc(x.case_number.replace('CASE-','Case #'))+'</span><span class="pill">'+esc(x.status)+'</span></div>';
  h+='<div class="case-type">'+esc(x.incident).replace(/_/g,' ')+'</div>';
  if(x.description) h+='<div class="case-desc">'+esc(x.description)+'</div>';
  if(x.status==='dispatched'||x.status==='en_route'){
    h+='<button class="btn btn-primary" style="margin-top:6px;padding:6px 12px;font-size:12px" onclick="confirmArrival(\''+x.id+'\')">✅ Provider has arrived</button>';
  }
  if(x.status==='resolved'&&!rated){
    h+='<div class="rating" style="margin-top:8px;display:flex;gap:4px">';
    for(var s=1;s<=5;s++) h+='<span onclick="rateCase(\''+x.id+'\','+s+')" style="cursor:pointer;font-size:22px;color:#e3ece8" onmouseover="this.style.color=\'#f5a623\'" onmouseout="this.style.color=\'#e3ece8\'">★</span>';
    h+='</div>';
  }
  if(rated) h+='<div style="margin-top:4px;color:var(--amber);font-size:14px">'+'★'.repeat(x.score)+'☆'.repeat(5-x.score)+'</div>';
  h+='</div>';
 });
 el('cases').innerHTML=h;}
async function rateCase(caseNo, score) {
  var r = await api('/api/case/rate', { method: 'POST', body: JSON.stringify({ caseID: caseNo, score: score }) });
  if (r.ok) loadCases();
  else alert('Rating failed: ' + (r.body.error || ''));
}
async function confirmArrival(caseId) {
  var r = await api('/api/case/arrived', { method: 'POST', body: JSON.stringify({ caseID: caseId }) });
  if (r.ok) { alert('✅ Arrival confirmed. Thank you!'); loadCases(); }
  else alert('Failed: ' + (r.body.error || ''));
}
// Service Worker for push notifications
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then(function(reg) {
    console.log('SW registered');
    if ('PushManager' in window) {
      Notification.requestPermission().then(function(perm) {
