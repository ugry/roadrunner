<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Insucar — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--brand:#0a7d5a;--brand-d:#086a4d;--navy:#0b1f2a;--amber:#f5a623;--bg:#f4f8f6;--surface:#fff;--line:#e3ece8;--muted:#5b7183;--fg:#0b1f2a;--radius:16px;--font:Inter,system-ui,Arial,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);color:var(--fg);background:radial-gradient(1100px 560px at 82% -12%,rgba(10,125,90,.10),transparent 60%),var(--bg);min-height:100vh}
  .bar{display:flex;align-items:center;gap:12px;padding:16px 26px;background:var(--surface);border-bottom:1px solid var(--line)}
  .bar .who{margin-left:auto;font-size:13px;color:var(--muted)}
  .wm{font-size:20px;font-weight:800;letter-spacing:-.02em}.wm span{color:var(--brand)}
  .wrap{max-width:560px;margin:34px auto;padding:0 16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 20px 60px rgba(11,31,42,.08);overflow:hidden}
  .card-h{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--line)}
  .card-b{padding:22px}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:16px}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;color:var(--fg);background:#fbfdfc}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(10,125,90,.15)}
  .row{display:flex;gap:12px}.row>div{flex:1}
  .btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;width:100%;margin-top:14px}
  .btn-primary{background:var(--brand);color:#fff}.btn-primary:hover{background:var(--brand-d)}
  .btn-danger{background:var(--amber);color:#3a2600}.btn-danger:hover{filter:brightness(.97)}
  .btn-ghost{background:#eef4f1;color:var(--navy)}
  .tabs{display:flex;gap:16px}.tabx{cursor:pointer;color:var(--muted);font-weight:700}.tabx.on{color:var(--brand)}
  .muted{color:var(--muted)} .hidden{display:none}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}td,th{border-bottom:1px solid var(--line);padding:8px;text-align:left}
  .pill{padding:2px 9px;border-radius:999px;background:#e6f4ee;color:var(--brand);font-size:12px;font-weight:700}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  @media(max-width:640px){.grid2{grid-template-columns:1fr}}
  #out{margin-top:10px;font-size:13px}
  .logo{width:34px;height:34px}
  .topbtn{border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:700;font-size:14px;padding:8px 16px;border-radius:10px;cursor:pointer}
  .topbtn:hover{border-color:var(--brand);color:var(--brand)}
  .case-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fbfdfc}
  .case-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .case-no{font-weight:800;font-size:14px}
  .case-type{font-size:12px;color:var(--muted);text-transform:capitalize;margin-top:3px}
  .case-desc{margin-top:6px;font-size:14px;line-height:1.45;word-break:break-word;overflow-wrap:anywhere;white-space:normal}
  #cases{max-height:60vh;overflow-y:auto}
</style></head>
<body>
<div class="bar">
  <svg class="logo" viewBox="0 0 80 80" aria-hidden="true"><defs><linearGradient id="s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12a06f"/><stop offset="1" stop-color="#0a7d5a"/></linearGradient></defs><path d="M40 3 L73 15 V40 C73 57 60 69 40 77 C20 69 7 57 7 40 V15 Z" fill="url(#s)"/><path d="M23 63 L36 25 H44 L57 63 Z" fill="#fff" opacity=".92"/><g transform="translate(40,23)"><path d="M0 -12 C6.6 -12 11 -7.6 11 -1.5 C11 5.5 0 14 0 14 C0 14 -11 5.5 -11 -1.5 C-11 -7.6 -6.6 -12 0 -12 Z" fill="#f5a623"/><circle cy="-1.5" r="4" fill="#0b1f2a"/></g></svg>
  <div class="wm">Insu<span>car</span></div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:12px">
    <span class="who" id="whoami"></span>
    <button id="loginTop" class="topbtn" onclick="showTab('login')">Log in</button>
    <button id="logoutTop" class="topbtn hidden" onclick="logout()">Log out</button>
  </div>
</div>

<div class="wrap">
  <!-- AUTH -->
  <div class="card" id="authcard">
    <div class="card-h"><div class="tabs"><span id="tabLogin" class="tabx on" onclick="showTab('login')">Log in</span><span id="tabReg" class="tabx" onclick="showTab('reg')">Register</span></div><span class="pill" style="margin-left:auto">unysolar.com</span></div>
    <div class="card-b">
      <div id="login">
        <h1>Welcome back</h1><div class="sub">Sign in to request assistance and track your case.</div>
        <label>Email</label><input id="l_email" value="claire.martin@example.fr">
        <label>Password</label><input id="l_pass" type="password" value="Claire#2026">
        <button class="btn btn-primary" onclick="login()">Log in</button>
        <div id="cognitoLogin" class="hidden" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)"><button class="btn btn-ghost" onclick="pkceLogin()" style="margin-top:0">Sign in with Cognito</button><div style="font-size:12px;color:var(--muted);margin-top:6px;text-align:center">Managed SSO login</div></div>
      </div>
      <div id="reg" class="hidden">
        <h1>Create your account</h1><div class="sub">Register so we already know you and your vehicle when you break down.</div>
        <div class="row"><div><label>First name</label><input id="r_first" value="New"></div><div><label>Last name</label><input id="r_last" value="Customer"></div></div>
        <label>Email</label><input id="r_email" placeholder="you@example.com">
        <div class="row"><div><label>Country</label><select id="r_country"><option>FR</option><option>GB</option><option>DE</option></select></div><div><label>Mobile (E.164)</label><input id="r_phone" placeholder="+33600000009"></div></div>
        <label>Password</label><input id="r_pass" type="password">
        <button class="btn btn-primary" onclick="register()">Create account &amp; sign in</button>
      </div>
      <div id="out" class="muted"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dash" class="hidden">
    <div class="grid2">
      <div class="card"><div class="card-h"><b>🚨 Request assistance</b></div><div class="card-b">
        <label>What happened?</label>
        <select id="i_type"><option value="breakdown">Car won't start</option><option value="accident">Accident</option><option value="flat_tyre">Flat tyre</option><option value="ev_no_charge">EV — no charge</option><option value="medical_emergency">Driver ill / medical</option><option value="other">Other</option></select>
        <label>Describe it</label><textarea id="i_desc" rows="2" placeholder="engine won't turn over on the A6 near Beaune"></textarea>
        <label>Location</label><input id="i_addr" placeholder="A6 southbound, km 292">
        <button class="btn btn-danger" onclick="submitIncident()">🚨 Request assistance now</button>
      </div></div>
      <div class="card"><div class="card-h"><b>My cases</b><span class="pill" id="me2" style="margin-left:auto"></span></div><div class="card-b" style="padding-top:8px"><div id="cases" class="muted">—</div></div></div>
    </div>
  </div>
</div>

<script>
// --- Cognito config (populated by backend or env; empty = no Cognito login) ---
const cognitoCfg = { domain: '', region: 'eu-west-1', clientId: '', redirectUri: location.origin + '/app/callback' };
(async () => { try { const r = await fetch('/api/auth/config'); if (r.ok) { const c = await r.json(); if (c.customerDomain) { cognitoCfg.domain = c.customerDomain; cognitoCfg.region = c.region; cognitoCfg.clientId = c.customerClientId; document.getElementById('cognitoLogin').classList.remove('hidden'); } } } catch (_) {} })();

function pkceLogin() {
  const verifier = Array.from(crypto.getRandomValues(new Uint8Array(32))).map(b => String.fromCharCode('A'.charCodeAt(0)+b%26)).join('');
  const encoder = new TextEncoder();
  crypto.subtle.digest('SHA-256', encoder.encode(verifier)).then(hash => {
    const challenge = btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
    const state = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => b.toString(16).padStart(2,'0')).join('');
    localStorage.setItem('cognito_pkce', JSON.stringify({ verifier, state, domain: cognitoCfg.domain, region: cognitoCfg.region, clientId: cognitoCfg.clientId, redirectUri: cognitoCfg.redirectUri, returnTo: '/app' }));
    const url = `https://${cognitoCfg.domain}.auth.${cognitoCfg.region}.amazoncognito.com/oauth2/authorize?response_type=code&client_id=${encodeURIComponent(cognitoCfg.clientId)}&redirect_uri=${encodeURIComponent(cognitoCfg.redirectUri)}&state=${state}&code_challenge_method=S256&code_challenge=${challenge}&scope=openid+email+profile`;
    window.location.href = url;
  });
}

function bearerApi(p, o) {
  o = o || {};
  o.headers = Object.assign({ 'Content-Type': 'application/json' }, o.headers || {});
  var tok = null;
  try { tok = JSON.parse(localStorage.getItem('cognito_tokens')); } catch (_) {}
  if (tok && tok.access_token && Date.now() < tok.expires_at) {
    o.headers['Authorization'] = 'Bearer ' + tok.access_token;
  } else {
    o.credentials = 'include';
  }
  return fetch(p, o).then(function(r) { return r.json().then(function(b) { return { ok: r.ok, status: r.status, body: b }; }).catch(function() { return { ok: r.ok, status: r.status, body: {} }; }); });
}

function api(p,o){return bearerApi(p,o);}
function v(id){return document.getElementById(id).value;}function el(id){return document.getElementById(id);}
function showTab(t){el('tabLogin').classList.toggle('on',t=='login');el('tabReg').classList.toggle('on',t=='reg');el('login').classList.toggle('hidden',t!='login');el('reg').classList.toggle('hidden',t!='reg');}
async function login(){const r=await api('/api/user/login',{method:'POST',body:JSON.stringify({email:v('l_email'),password:v('l_pass')})});if(r.ok)enter(r.body);else el('out').textContent='⚠ '+(r.body.error||'login failed');}
async function register(){const r=await api('/api/register',{method:'POST',body:JSON.stringify({first:v('r_first'),last:v('r_last'),email:v('r_email'),country:v('r_country'),phone:v('r_phone'),password:v('r_pass'),consents:['terms','privacy']})});if(r.ok)enter({name:v('r_first')+' '+v('r_last')});else el('out').textContent='⚠ '+(r.body.error||'register failed');}
async function logout(){
  localStorage.removeItem('cognito_tokens');
  localStorage.removeItem('cognito_pkce');
  await api('/api/logout',{method:'POST'});
  location.reload();
}
function enter(me){el('authcard').classList.add('hidden');el('dash').classList.remove('hidden');el('whoami').textContent=me.name||'';el('me2').textContent=me.name||'';el('loginTop').classList.add('hidden');el('logoutTop').classList.remove('hidden');loadCases();}
async function submitIncident(){const r=await api('/api/user/incident',{method:'POST',body:JSON.stringify({incident:v('i_type'),description:v('i_desc'),address:v('i_addr')})});if(r.ok){alert('Case created: '+r.body.case_number+' — a coordinator will assist you.');loadCases();}else alert('Error: '+(r.body.error||r.status));}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function loadCases(){const r=await api('/api/user/cases');const c=r.body.cases||[];if(!c.length){el('cases').textContent='No cases yet.';return;}
 let h='';c.forEach(x=>h+=`<div class="case-item"><div class="case-top"><span class="case-no">${esc(x.case_number.replace('CASE-','Case #'))}</span><span class="pill">${esc(x.status)}</span></div><div class="case-type">${esc(x.incident).replace(/_/g,' ')}</div>${x.description?`<div class="case-desc">${esc(x.description)}</div>`:''}</div>`);
 el('cases').innerHTML=h;}
(async()=>{const r=await api('/api/me');if(r.body.authenticated&&r.body.role==='user')enter(r.body);})();
</script>
</body></html>
