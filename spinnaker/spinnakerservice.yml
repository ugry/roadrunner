# Spinnaker installed via the spinnaker-operator (kind: SpinnakerService).
# Persistence: S3. Auth/exposure kept minimal for the prototype; harden before production.
apiVersion: spinnaker.io/v1alpha2
kind: SpinnakerService
metadata:
  name: spinnaker
spec:
  spinnakerConfig:
    config:
      version: 1.36.1
      persistentStorage:
        persistentStoreType: s3
        s3:
          bucket: insucar-spinnaker-326804802908
          rootFolder: front50
          region: eu-west-1
      features:
        pipelineTemplates: true
      # ------------------------------------------------------------------
      # AuthN (OIDC via Amazon Cognito staff pool) + AuthZ (fiat role-based).
      # Replaces the prototype's "no auth / open to anyone with the URL" posture.
      # Roles are sourced from the Cognito `cognito:groups` claim and drive:
      #   - who can see/operate the app (account/application permissions)
      #   - who can approve a manualJudgment (stage `selectedStageRoles`)
      # clientId / URLs come from Terraform outputs:
      #   cognito_spinnaker_client_id, cognito_staff_domain, cognito_staff_issuer
      # The client secret is NOT stored here: it is referenced from a
      # Kubernetes secret via halyard's encrypted-secret syntax. Create it
      # first (secret value = the Cognito app client secret):
      #   kubectl -n spinnaker create secret generic spin-secrets \
      #           --from-literal=oidc-client-secret=<COGNITO_APP_CLIENT_SECRET>
      # ------------------------------------------------------------------
      security:
        authn:
          oauth2:
            enabled: true
            client:
              clientId: REPLACE_WITH_cognito_spinnaker_client_id
              clientSecret: encrypted:k8s!n:spin-secrets!k:oidc-client-secret
              accessTokenUri: https://insucar-prod-staff.auth.eu-west-1.amazoncognito.com/oauth2/token
              userAuthorizationUri: https://insucar-prod-staff.auth.eu-west-1.amazoncognito.com/oauth2/authorize
              userInfoUri: https://insucar-prod-staff.auth.eu-west-1.amazoncognito.com/oauth2/userInfo
              scope: openid email profile
            provider: OTHER
            userInfoMapping:
              email: email
              firstName: given_name
              lastName: family_name
              username: username
              roles: cognito:groups
        authz:
          enabled: true
          groupMembership:
            service: EXTERNAL
      # Jenkins (igor) integration — CI triggers/queries
      ci:
        jenkins:
          enabled: true
          masters:
            - name: insucar-jenkins
              address: http://jenkins.jenkins.svc.cluster.local:8080
              username: admin
              # password supplied via profiles/secret at apply time
      # Kubernetes deploy target (in-cluster account)
      providers:
        kubernetes:
          enabled: true
          accounts:
            - name: insucar-k8s
              providerVersion: V2
              # Restrict who can view/deploy through this account (fiat roles
              # from the OIDC groups claim). Developers get READ; only
              # releasers/product-owners get WRITE (deploy).
              permissions:
                READ:
                  - insucar-developers
                  - insucar-releasers
                  - insucar-product-owners
                WRITE:
                  - insucar-releasers
                  - insucar-product-owners
              dockerRegistries: []
              context: default
              onlySpinnakerManaged: true
  # Expose Deck (UI) and Gate (API). Prototype used a plain public LB with
  # no auth; with OIDC/fiat now enabled above, additionally restrict the LB
  # to admin networks and use an NLB. Best practice: set type ClusterIP and
  # front Deck/Gate with the ingress + TLS + OIDC instead of a public LB.
  expose:
    type: service
    service:
      type: LoadBalancer
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
        # Lock the LB to admin CIDRs (kubernetes honors this on AWS):
        # service.beta.kubernetes.io/load-balancer-source-ranges: "203.0.113.0/24"
